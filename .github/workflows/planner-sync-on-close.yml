name: Planner Sync On Close

on:
  issues:
    types: [closed, reopened]

jobs:
  planner-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Planner Task ID from issue body
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const m = body.match(/Planner Task ID:\s*`?([A-Za-z0-9_-]+)`?/i);
            const taskId = m ? m[1] : '';
            core.setOutput('taskId', taskId);
            core.setOutput('isClosed', context.payload.action === 'closed' ? 'true' : 'false');

      - name: Skip if no Planner Task ID
        if: steps.extract.outputs.taskId == ''
        run: echo "No Planner Task ID found. Skipping."

      - name: Update Planner status via Graph
        if: steps.extract.outputs.taskId != ''
        env:
          PLANNER_TASK_ID: ${{ steps.extract.outputs.taskId }}
          ISSUE_STATE_CLOSED: ${{ steps.extract.outputs.isClosed }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
        run: |
          set -e
          if [ -z "$MS_TENANT_ID" ] || [ -z "$MS_CLIENT_ID" ] || [ -z "$MS_CLIENT_SECRET" ]; then
            echo "Missing Microsoft secrets. Configure MS_TENANT_ID, MS_CLIENT_ID, MS_CLIENT_SECRET.";
            exit 0
          fi

          TOKEN=$(curl -sS -X POST "https://login.microsoftonline.com/${MS_TENANT_ID}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=${MS_CLIENT_ID}&client_secret=${MS_CLIENT_SECRET}&scope=https%3A%2F%2Fgraph.microsoft.com%2F.default&grant_type=client_credentials" | jq -r .access_token)

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain access token";
            exit 1
          fi

          if [ "$ISSUE_STATE_CLOSED" = "true" ]; then
            PERCENT=100
          else
            PERCENT=0
          fi

          TASK_ETAG=$(curl -sS -D /tmp/task_headers.txt -o /tmp/task_get_resp.json \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://graph.microsoft.com/v1.0/planner/tasks/${PLANNER_TASK_ID}" >/dev/null 2>&1; \
            awk 'BEGIN{IGNORECASE=1} /^ETag:/{sub(/\r/,"",$2); print $2}' /tmp/task_headers.txt)

          if [ -z "$TASK_ETAG" ]; then
            echo "Failed to read task ETag";
            cat /tmp/task_get_resp.json || true
            exit 1
          fi

          HTTP_CODE=$(curl -sS -o /tmp/planner_patch_resp.json -w "%{http_code}" -X PATCH "https://graph.microsoft.com/v1.0/planner/tasks/${PLANNER_TASK_ID}" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -H "If-Match: ${TASK_ETAG}" \
            -d "{\"percentComplete\": ${PERCENT}}")

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Planner PATCH failed with HTTP ${HTTP_CODE}";
            cat /tmp/planner_patch_resp.json || true
            exit 1
          fi

          echo "Planner task ${PLANNER_TASK_ID} updated to ${PERCENT}%"
